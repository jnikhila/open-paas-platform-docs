site_name: Open PaaS Platform Documentation
theme: material

# GitHub Pages configuration
site_dir: site
repo_url: https://github.com/jnikhila/open-paas-platform-docs
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Get Started:
      - Quick Start: getting-started/quick-start.md
  - Integrations:
      - Stripe Payments: integrations/payments.md
      - Data Ingestion: integrations/data-ingestion.md
      - Real-time Sync: integrations/real-time-sync.md
      - Webhook Processing: integrations/webhooks.md
  - Core Concepts:
      - Architecture: concepts/architecture.md
      - Security Model: concepts/security.md
  - References:
      - Glossary: references/glossary.md
  - Troubleshooting: troubleshooting/troubleshooting.md

markdown_extensions:
  - admonition
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - abbr
  - pymdownx.snippets
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
        custom_fences:
           - name: mermaid
             class: mermaid
             format: !!python/name:pymdownx.superfences.fence_code_format
      
extra_javascript:
    - javascripts/mathjax.js
    - javascripts/footer.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
    - css/custom.css
    - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css
